<!DOCTYPE html>
<html lang="fr">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mettre en pause</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-[#F5F7FA]">
<div id="popup-pause-screen" class="w-full h-[844px] max-w-[390px] mx-auto relative overflow-hidden bg-[#F5F7FA]">

  <div id="backdrop" class="absolute inset-0 flex flex-col">
    <div class="h-[44px]"></div>
    <div class="px-5 pt-2 opacity-40">
      <div class="h-6 w-1/2 bg-[#C9CFD6] rounded mb-4"></div>
      <div class="h-16 w-full bg-[#C9CFD6] rounded-xl mb-3"></div>
      <div class="h-24 w-full bg-[#C9CFD6] rounded-xl mb-3"></div>
      <div class="h-24 w-full bg-[#C9CFD6] rounded-xl"></div>
    </div>
    <div class="absolute inset-0 bg-[#0B1F33]/60"></div>
  </div>

  <div id="bottom-sheet" class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[20px] shadow-2xl flex flex-col">
    <div class="flex justify-center pt-3 pb-2">
      <div class="w-10 h-1.5 rounded-full bg-[#E2E6EA]"></div>
    </div>

    <div class="px-5 pb-4 flex flex-col items-center">
      <div class="w-14 h-14 rounded-full bg-[#F0F2F4] flex items-center justify-center mb-3">
        <i class="fa-solid fa-pause text-[#6B7280] text-xl"></i>
      </div>
      <h2 class="text-[#0B1F33] font-bold text-lg text-center mb-1">Mettre vos missions en pause ?</h2>
      <p class="text-[#6B7280] text-xs font-medium text-center mb-4">Vous ne recevrez plus de nouvelles propositions de mission tant que vous êtes hors ligne.</p>

      <div class="w-full flex flex-wrap gap-2 justify-center">
        <div class="h-10 px-4 rounded-lg bg-[#0B5FA5] flex items-center justify-center"><span class="text-white font-semibold text-sm">1 heure</span></div>
        <div class="h-10 px-4 rounded-lg bg-white border-2 border-[#E2E6EA] flex items-center justify-center"><span class="text-[#6B7280] font-semibold text-sm">Aujourd'hui</span></div>
        <div class="h-10 px-4 rounded-lg bg-white border-2 border-[#E2E6EA] flex items-center justify-center"><span class="text-[#6B7280] font-semibold text-sm">Jusqu'à réactivation manuelle</span></div>
      </div>
    </div>

    <div class="px-5 pt-2 pb-3">
      <button class="w-full h-13 py-3.5 rounded-xl bg-[#0B1F33] text-white font-bold text-base shadow-sm mb-2.5">Confirmer la pause</button>
      <button class="w-full h-10 text-[#6B7280] font-semibold text-sm">Annuler</button>
    </div>
    <div class="h-[24px] w-full flex-shrink-0"></div>
  </div>
</div>
</body>
</html>
