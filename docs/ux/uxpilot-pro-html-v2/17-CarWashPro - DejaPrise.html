<!DOCTYPE html>
<html lang="fr">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Détail de la mission</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-[#F5F7FA]">
<div id="deja-prise-screen" class="w-full h-[844px] max-w-[390px] mx-auto bg-[#F5F7FA] flex flex-col overflow-hidden relative">
  <div class="h-[44px] w-full flex-shrink-0"></div>

  <div id="deja-prise-header" class="px-5 pt-2 pb-3 flex-shrink-0 flex items-center justify-center relative">
    <button class="absolute left-5 w-9 h-9 flex items-center justify-center"><i class="fa-solid fa-chevron-left text-[#0B1F33] text-lg"></i></button>
    <span class="text-[#0B1F33] font-bold text-base">Détail de la mission</span>
  </div>

  <div id="deja-prise-content" class="flex-1 overflow-y-auto px-6 pt-10 flex flex-col items-center">
    <div class="w-[100px] h-[100px] rounded-full bg-[#F0F2F4] flex items-center justify-center mb-6">
      <i class="fa-solid fa-user-clock text-[#6B7280] text-4xl"></i>
    </div>
    <h1 class="text-[#0B1F33] font-bold text-2xl tracking-tight text-center mb-3">Cette mission n'est plus disponible</h1>
    <p class="text-[#6B7280] text-sm font-medium text-center leading-relaxed mb-6">Un autre professionnel l'a acceptée avant vous. Ne vous inquiétez pas, de nouvelles missions arrivent régulièrement.</p>

    <div id="tip-card" class="w-full bg-white rounded-xl shadow-sm p-4 flex items-start gap-3">
      <i class="fa-solid fa-lightbulb text-[#B7791E] text-base mt-0.5"></i>
      <p class="text-[#6B7280] text-sm font-medium leading-snug">Astuce : activez les notifications pour être alerté plus vite.</p>
    </div>
  </div>

  <div id="deja-prise-cta" class="px-4 pt-3 pb-2 flex-shrink-0">
    <button class="w-full h-14 rounded-xl bg-[#0B5FA5] text-white font-bold text-base shadow-sm">Voir d'autres missions</button>
  </div>
  <div class="h-[24px] w-full flex-shrink-0 flex items-end justify-center pb-2">
    <div class="w-32 h-1 rounded-full bg-[#0B1F33]/15"></div>
  </div>
</div>
</body>
</html>
