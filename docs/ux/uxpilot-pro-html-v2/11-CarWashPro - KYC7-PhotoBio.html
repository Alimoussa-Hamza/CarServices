<!DOCTYPE html>
<html lang="fr">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votre profil public</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-[#F5F7FA]">
<div id="kyc7-screen" class="w-full h-[844px] max-w-[390px] mx-auto bg-[#F5F7FA] flex flex-col overflow-hidden relative">
  <div class="h-[44px] w-full flex-shrink-0"></div>

  <div id="kyc7-header" class="px-5 pt-2 pb-3 flex-shrink-0">
    <div class="flex items-center justify-between mb-4">
      <button class="w-9 h-9 flex items-center justify-center -ml-2"><i class="fa-solid fa-chevron-left text-[#0B1F33] text-lg"></i></button>
      <span class="text-[#6B7280] text-xs font-semibold">7/7</span>
    </div>
    <div class="flex gap-1.5 mb-5">
      <div class="h-1.5 flex-1 rounded-full bg-[#0B5FA5]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#0B5FA5]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#0B5FA5]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#0B5FA5]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#0B5FA5]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#0B5FA5]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#0B5FA5]"></div>
    </div>
    <h1 class="text-[#0B1F33] font-bold text-2xl tracking-tight mb-2">Votre profil public</h1>
    <p class="text-[#6B7280] text-sm font-medium">Une photo et une courte présentation rassurent vos clients.</p>
  </div>

  <div id="kyc7-content" class="flex-1 overflow-y-auto px-5 pt-3 flex flex-col gap-5">
    <div id="avatar-section" class="flex flex-col items-center py-2">
      <div class="relative w-[120px] h-[120px]">
        <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-2.jpg" class="w-full h-full rounded-full object-cover border-4 border-white shadow-sm" />
        <button class="absolute bottom-0 right-0 w-8 h-8 rounded-full bg-[#0B5FA5] border-2 border-white flex items-center justify-center">
          <i class="fa-solid fa-camera text-white text-xs"></i>
        </button>
      </div>
      <button class="text-[#0B5FA5] font-bold text-sm mt-3">Prendre une photo</button>
    </div>

    <div>
      <label class="block text-[#0B1F33] text-sm font-semibold mb-2">Présentation</label>
      <div class="rounded-xl border-2 border-[#E2E6EA] bg-white p-4 min-h-[96px] relative">
        <p class="text-[#0B1F33] text-sm leading-relaxed">Passionné d'automobile depuis toujours, je propose un lavage soigné et écologique directement chez vous ou sur votre lieu de travail.</p>
        <span class="absolute bottom-2 right-3 text-[#9CA3AF] text-[11px] font-medium">148/300</span>
      </div>
    </div>

    <div>
      <label class="block text-[#0B1F33] text-sm font-semibold mb-2">Prénom affiché</label>
      <div class="h-14 rounded-xl border-2 border-[#E2E6EA] bg-white flex items-center px-4">
        <input type="text" value="Marc" class="w-full text-[#0B1F33] text-base font-medium outline-none bg-transparent" />
      </div>
    </div>
  </div>

  <div id="kyc7-cta" class="px-4 pt-3 pb-3 flex-shrink-0 bg-[#F5F7FA]">
    <p class="text-[#6B7280] text-xs font-medium text-center mb-3">Votre dossier sera examiné sous 24 à 48h.</p>
    <button class="w-full h-14 rounded-xl bg-[#0B5FA5] text-white font-bold text-base shadow-sm">Envoyer mon dossier</button>
  </div>
  <div class="h-[24px] w-full flex-shrink-0 flex items-end justify-center pb-2">
    <div class="w-32 h-1 rounded-full bg-[#0B1F33]/15"></div>
  </div>
</div>
</body>
</html>
