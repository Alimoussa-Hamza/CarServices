# Railway — template CARSERVICE API (CS-M16-S04)
# Lier le repo GitHub, root directory = monorepo, Dockerfile path = apps/api/Dockerfile
# Variables : coller depuis apps/api/.env.example (secrets hors git)

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[service]
internalPort = 3000
