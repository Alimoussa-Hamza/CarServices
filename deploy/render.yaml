# Render Blueprint — CARSERVICE API staging (CS-M16-S04)
# Dashboard → New → Blueprint → connect repo → apply
# Remplacer sync: false et renseigner les secrets dans l’UI Render.

services:
  - type: web
    name: carservice-api-staging
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: DATABASE_URL
        fromDatabase:
          name: carservice-pg-staging
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

databases:
  - name: carservice-pg-staging
    plan: free
    postgresMajorVersion: '16'
