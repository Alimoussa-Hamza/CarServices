<!DOCTYPE html>
<html lang="fr">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-[#F5F7FA]">
<div id="planning-screen" class="w-full h-[844px] max-w-[390px] mx-auto bg-[#F5F7FA] flex flex-col overflow-hidden relative">
  <div class="h-[44px] w-full flex-shrink-0"></div>

  <div id="planning-header" class="px-5 pt-2 pb-4 flex-shrink-0 flex items-center justify-between">
    <h1 class="text-[#0B1F33] font-bold text-xl tracking-tight">Planning</h1>
    <button class="h-9 px-3.5 rounded-full border-2 border-[#E2E6EA] bg-white flex items-center gap-1.5">
      <i class="fa-solid fa-pause text-[#6B7280] text-xs"></i>
      <span class="text-[#0B1F33] text-xs font-bold">Pause aujourd'hui</span>
    </button>
  </div>

  <div id="planning-content" class="flex-1 overflow-y-auto px-5 flex flex-col gap-5">
    <div id="week-strip" class="flex justify-between gap-1">
      <div class="flex flex-col items-center gap-1.5 flex-1">
        <span class="text-[#6B7280] text-[10px] font-semibold">Lun</span>
        <div class="w-9 h-9 rounded-full bg-[#0B5FA5] flex items-center justify-center"><span class="text-white font-bold text-sm">12</span></div>
        <div class="w-1 h-1 rounded-full bg-[#0B5FA5]"></div>
      </div>
      <div class="flex flex-col items-center gap-1.5 flex-1">
        <span class="text-[#6B7280] text-[10px] font-semibold">Mar</span>
        <div class="w-9 h-9 rounded-full flex items-center justify-center"><span class="text-[#0B1F33] font-bold text-sm">13</span></div>
        <div class="w-1 h-1 rounded-full bg-[#0B5FA5]"></div>
      </div>
      <div class="flex flex-col items-center gap-1.5 flex-1">
        <span class="text-[#C9CFD6] text-[10px] font-semibold">Mer</span>
        <div class="w-9 h-9 rounded-full flex items-center justify-center"><span class="text-[#C9CFD6] font-bold text-sm">14</span></div>
        <div class="w-1 h-1"></div>
      </div>
      <div class="flex flex-col items-center gap-1.5 flex-1">
        <span class="text-[#6B7280] text-[10px] font-semibold">Jeu</span>
        <div class="w-9 h-9 rounded-full flex items-center justify-center"><span class="text-[#0B1F33] font-bold text-sm">15</span></div>
        <div class="w-1 h-1 rounded-full bg-[#0B5FA5]"></div>
      </div>
      <div class="flex flex-col items-center gap-1.5 flex-1">
        <span class="text-[#6B7280] text-[10px] font-semibold">Ven</span>
        <div class="w-9 h-9 rounded-full flex items-center justify-center"><span class="text-[#0B1F33] font-bold text-sm">16</span></div>
        <div class="w-1 h-1 rounded-full bg-[#0B5FA5]"></div>
      </div>
      <div class="flex flex-col items-center gap-1.5 flex-1">
        <span class="text-[#6B7280] text-[10px] font-semibold">Sam</span>
        <div class="w-9 h-9 rounded-full flex items-center justify-center"><span class="text-[#0B1F33] font-bold text-sm">17</span></div>
        <div class="w-1 h-1"></div>
      </div>
      <div class="flex flex-col items-center gap-1.5 flex-1">
        <span class="text-[#C9CFD6] text-[10px] font-semibold">Dim</span>
        <div class="w-9 h-9 rounded-full flex items-center justify-center"><span class="text-[#C9CFD6] font-bold text-sm">18</span></div>
        <div class="w-1 h-1"></div>
      </div>
    </div>

    <div>
      <div class="flex items-center justify-between mb-3">
        <span class="text-[#0B1F33] font-bold text-base">Lundi 12 mai</span>
        <span class="text-[#6B7280] text-xs font-medium">3 créneaux disponibles</span>
      </div>
      <div class="flex flex-wrap gap-2">
        <div class="h-10 px-4 rounded-lg bg-[#0B5FA5] flex items-center justify-center"><span class="text-white font-semibold text-sm">8h-12h</span></div>
        <div class="h-10 px-3 rounded-lg bg-[#E7F0FA] border-2 border-[#0B5FA5] flex flex-col items-center justify-center leading-none">
          <span class="text-[#0B1F33] font-semibold text-xs">12h-14h</span>
          <span class="text-[#0B5FA5] font-bold text-[9px] mt-0.5">Mission</span>
        </div>
        <div class="h-10 px-4 rounded-lg bg-[#0B5FA5] flex items-center justify-center"><span class="text-white font-semibold text-sm">14h-18h</span></div>
        <div class="h-10 px-4 rounded-lg bg-white border-2 border-[#E2E6EA] flex items-center justify-center"><span class="text-[#6B7280] font-semibold text-sm">18h-20h</span></div>
        <div class="h-10 px-4 rounded-lg bg-white border-2 border-[#E2E6EA] flex items-center justify-center"><span class="text-[#6B7280] font-semibold text-sm">20h-22h</span></div>
      </div>
    </div>

    <div class="pb-3">
      <p class="text-[#0B1F33] font-bold text-sm mb-3">Missions planifiées</p>
      <div class="flex flex-col gap-3">
        <div class="bg-white rounded-xl shadow-sm p-4 flex items-center justify-between">
          <div>
            <p class="text-[#0B1F33] font-bold text-sm">Lun 12 mai · 12h00</p>
            <p class="text-[#6B7280] text-xs font-medium mt-0.5">Extérieur rapide</p>
          </div>
          <span class="text-[#0B5FA5] font-bold text-sm">32,00 € net</span>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-4 flex items-center justify-between">
          <div>
            <p class="text-[#0B1F33] font-bold text-sm">Jeu 15 mai · 09h30</p>
            <p class="text-[#6B7280] text-xs font-medium mt-0.5">Complet</p>
          </div>
          <span class="text-[#0B5FA5] font-bold text-sm">77,60 € net</span>
        </div>
      </div>
    </div>
  </div>

  <div id="bottom-tab-bar" class="flex-shrink-0 bg-white border-t border-[#E2E6EA] flex items-center justify-around pt-2 pb-1">
    <div class="flex flex-col items-center gap-1">
      <i class="fa-solid fa-list-check text-[#9CA3AF] text-lg"></i>
      <span class="text-[#9CA3AF] text-[11px] font-semibold">Missions</span>
    </div>
    <div class="flex flex-col items-center gap-1">
      <i class="fa-solid fa-calendar-days text-[#0B5FA5] text-lg"></i>
      <span class="text-[#0B5FA5] text-[11px] font-bold">Planning</span>
    </div>
    <div class="flex flex-col items-center gap-1">
      <i class="fa-solid fa-wallet text-[#9CA3AF] text-lg"></i>
      <span class="text-[#9CA3AF] text-[11px] font-semibold">Gains</span>
    </div>
    <div class="flex flex-col items-center gap-1">
      <i class="fa-regular fa-user text-[#9CA3AF] text-lg"></i>
      <span class="text-[#9CA3AF] text-[11px] font-semibold">Profil</span>
    </div>
  </div>
  <div class="h-[24px] w-full flex-shrink-0 bg-white flex items-end justify-center pb-2">
    <div class="w-32 h-1 rounded-full bg-[#0B1F33]/15"></div>
  </div>
</div>
</body>
</html>
