<!DOCTYPE html>
<html lang="fr">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Méthodes de lavage</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-[#F5F7FA]">
<div id="kyc3-screen" class="w-full h-[844px] max-w-[390px] mx-auto bg-[#F5F7FA] flex flex-col overflow-hidden relative">
  <div class="h-[44px] w-full flex-shrink-0"></div>

  <div id="kyc3-header" class="px-5 pt-2 pb-3 flex-shrink-0">
    <div class="flex items-center justify-between mb-4">
      <button class="w-9 h-9 flex items-center justify-center -ml-2"><i class="fa-solid fa-chevron-left text-[#0B1F33] text-lg"></i></button>
      <span class="text-[#6B7280] text-xs font-semibold">3/7</span>
    </div>
    <div class="flex gap-1.5 mb-5">
      <div class="h-1.5 flex-1 rounded-full bg-[#0B5FA5]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#0B5FA5]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#0B5FA5]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#E2E6EA]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#E2E6EA]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#E2E6EA]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#E2E6EA]"></div>
    </div>
    <h1 class="text-[#0B1F33] font-bold text-2xl tracking-tight mb-2">Vos méthodes de lavage</h1>
    <p class="text-[#6B7280] text-sm font-medium">Sélectionnez au moins une méthode que vous proposez.</p>
  </div>

  <div id="kyc3-list" class="flex-1 overflow-y-auto px-5 pt-3 flex flex-col gap-3">
    <div id="method-waterless" class="bg-white rounded-xl shadow-sm p-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-full bg-[#E7F0FA] flex items-center justify-center flex-shrink-0">
          <i class="fa-solid fa-spray-can text-[#0B5FA5] text-base"></i>
        </div>
        <div>
          <p class="text-[#0B1F33] font-semibold text-sm">Sans eau</p>
          <p class="text-[#6B7280] text-xs font-medium">Produits biodégradables, sans point d'eau</p>
        </div>
      </div>
      <div class="w-11 h-[26px] rounded-full bg-[#1B8A5A] flex items-center px-0.5 justify-end flex-shrink-0">
        <div class="w-[21px] h-[21px] rounded-full bg-white shadow"></div>
      </div>
    </div>

    <div id="method-vapeur" class="bg-white rounded-xl shadow-sm p-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-full bg-[#E7F0FA] flex items-center justify-center flex-shrink-0">
          <i class="fa-solid fa-wind text-[#0B5FA5] text-base"></i>
        </div>
        <div>
          <p class="text-[#0B1F33] font-semibold text-sm">Vapeur</p>
          <p class="text-[#6B7280] text-xs font-medium">Haute température, sans détergent</p>
        </div>
      </div>
      <div class="w-11 h-[26px] rounded-full bg-[#1B8A5A] flex items-center px-0.5 justify-end flex-shrink-0">
        <div class="w-[21px] h-[21px] rounded-full bg-white shadow"></div>
      </div>
    </div>

    <div id="info-banner" class="flex items-start gap-2.5 px-1 pt-2">
      <i class="fa-solid fa-circle-info text-[#9CA3AF] text-sm mt-0.5"></i>
      <p class="text-[#6B7280] text-xs font-medium leading-snug">Au moins une méthode est requise. Le detailing se choisit à l'étape des formules, pas ici.</p>
    </div>
  </div>

  <div id="kyc3-cta" class="px-4 pt-3 pb-3 flex-shrink-0 bg-[#F5F7FA]">
    <button class="w-full h-14 rounded-xl bg-[#0B5FA5] text-white font-bold text-base shadow-sm">Continuer</button>
  </div>
  <div class="h-[24px] w-full flex-shrink-0 flex items-end justify-center pb-2">
    <div class="w-32 h-1 rounded-full bg-[#0B1F33]/15"></div>
  </div>
</div>
</body>
</html>
