<!DOCTYPE html>
<html lang="fr">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-[#F5F7FA]">
<div id="notif-screen" class="w-full h-[844px] max-w-[390px] mx-auto bg-[#F5F7FA] flex flex-col overflow-hidden relative">
  <div class="h-[44px] w-full flex-shrink-0"></div>

  <div id="notif-content" class="flex-1 flex flex-col items-center px-6 pt-10">
    <div id="bell-illustration" class="w-28 h-28 rounded-full bg-[#E7F0FA] flex items-center justify-center mb-8">
      <i class="fa-regular fa-bell text-[#0B5FA5] text-5xl"></i>
    </div>
    <h1 class="text-[#0B1F33] font-bold text-2xl tracking-tight text-center mb-3">Ne manquez aucune mission</h1>
    <p class="text-[#6B7280] text-sm font-medium text-center leading-relaxed mb-8">Activez les notifications pour être alerté dès qu'une mission est disponible près de chez vous.</p>

    <div id="benefits-card" class="w-full bg-white rounded-2xl shadow-sm p-5 flex flex-col gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-[#E7F0FA] flex items-center justify-center flex-shrink-0">
          <i class="fa-solid fa-bolt text-[#0B5FA5] text-base"></i>
        </div>
        <span class="text-[#0B1F33] font-semibold text-sm">Alertes instantanées</span>
      </div>
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-[#E7F0FA] flex items-center justify-center flex-shrink-0">
          <i class="fa-regular fa-clock text-[#0B5FA5] text-base"></i>
        </div>
        <span class="text-[#0B1F33] font-semibold text-sm">Ne ratez plus une mission</span>
      </div>
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-[#E7F0FA] flex items-center justify-center flex-shrink-0">
          <i class="fa-solid fa-euro-sign text-[#0B5FA5] text-base"></i>
        </div>
        <span class="text-[#0B1F33] font-semibold text-sm">Confirmez en un tap</span>
      </div>
    </div>
  </div>

  <div id="notif-cta" class="px-4 pt-3 pb-2 flex-shrink-0">
    <button class="w-full h-14 rounded-xl bg-[#0B5FA5] text-white font-bold text-base shadow-sm mb-3">Activer les notifications</button>
    <button class="w-full h-10 text-[#6B7280] font-semibold text-sm">Plus tard</button>
  </div>
  <div class="h-[24px] w-full flex-shrink-0 flex items-end justify-center pb-2">
    <div class="w-32 h-1 rounded-full bg-[#0B1F33]/15"></div>
  </div>
</div>
</body>
</html>
