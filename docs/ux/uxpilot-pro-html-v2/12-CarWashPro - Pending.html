<!DOCTYPE html>
<html lang="fr">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dossier en validation</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-[#F5F7FA]">
<div id="pending-screen" class="w-full h-[844px] max-w-[390px] mx-auto bg-[#F5F7FA] flex flex-col overflow-hidden relative">
  <div class="h-[44px] w-full flex-shrink-0"></div>

  <div id="pending-content" class="flex-1 overflow-y-auto px-6 pt-10 flex flex-col items-center">
    <div class="w-[100px] h-[100px] rounded-full bg-[#FBF0DD] flex items-center justify-center mb-6">
      <i class="fa-solid fa-hourglass-half text-[#B7791E] text-4xl"></i>
    </div>
    <h1 class="text-[#0B1F33] font-bold text-2xl tracking-tight text-center mb-3">Dossier en cours de validation</h1>
    <p class="text-[#6B7280] text-sm font-medium text-center leading-relaxed mb-8">Notre équipe vérifie vos informations. Cela prend généralement 24 à 48h.</p>

    <div id="steps-card" class="w-full bg-white rounded-2xl shadow-sm p-5">
      <div class="flex gap-3">
        <div class="flex flex-col items-center flex-shrink-0">
          <div class="w-8 h-8 rounded-full bg-[#1B8A5A] flex items-center justify-center"><i class="fa-solid fa-check text-white text-xs"></i></div>
          <div class="w-0.5 flex-1 bg-[#1B8A5A] my-1"></div>
        </div>
        <div class="pb-6 pt-1">
          <p class="text-[#0B1F33] font-semibold text-sm">Dossier reçu</p>
          <p class="text-[#6B7280] text-xs font-medium mt-0.5">Aujourd'hui à 09:14</p>
        </div>
      </div>
      <div class="flex gap-3">
        <div class="flex flex-col items-center flex-shrink-0">
          <div class="w-8 h-8 rounded-full bg-[#B7791E] flex items-center justify-center"><i class="fa-solid fa-clock text-white text-xs"></i></div>
          <div class="w-0.5 flex-1 bg-[#E2E6EA] my-1"></div>
        </div>
        <div class="pb-6 pt-1">
          <p class="text-[#0B1F33] font-semibold text-sm">Vérification des documents</p>
          <span class="inline-block mt-1 text-[10px] font-bold text-[#B7791E] bg-[#FBF0DD] rounded-full px-2 py-0.5">En cours</span>
        </div>
      </div>
      <div class="flex gap-3">
        <div class="flex flex-col items-center flex-shrink-0">
          <div class="w-8 h-8 rounded-full border-2 border-[#E2E6EA] bg-white"></div>
        </div>
        <div class="pt-1">
          <p class="text-[#9CA3AF] font-semibold text-sm">Validation finale</p>
        </div>
      </div>
    </div>

    <div class="flex items-start gap-2.5 mt-6 px-1">
      <i class="fa-regular fa-bell text-[#9CA3AF] text-sm mt-0.5"></i>
      <p class="text-[#6B7280] text-xs font-medium leading-snug">Vous recevrez une notification dès que votre dossier sera validé.</p>
    </div>
  </div>

  <div id="pending-cta" class="px-4 pt-3 pb-3 flex-shrink-0">
    <button class="w-full h-13 py-3.5 rounded-xl border-2 border-[#E2E6EA] text-[#6B7280] font-semibold text-base">Actualiser le statut</button>
  </div>
  <div class="h-[24px] w-full flex-shrink-0 flex items-end justify-center pb-2">
    <div class="w-32 h-1 rounded-full bg-[#0B1F33]/15"></div>
  </div>
</div>
</body>
</html>
