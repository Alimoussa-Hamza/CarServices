<!DOCTYPE html>
<html lang="fr">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splash</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  body{font-family:'Inter',sans-serif;}
  .safe-top{height:44px;}
  .safe-bottom{height:24px;}
</style>
</head>
<body class="bg-[#F5F7FA]">
<div id="splash-screen" class="w-full h-[844px] max-w-[390px] mx-auto bg-[#F5F7FA] flex flex-col overflow-hidden relative">
  <div class="safe-top w-full flex-shrink-0"></div>

  <div id="splash-content" class="flex-1 flex flex-col items-center justify-center gap-5 px-8">
    <div id="brand-mark" class="w-20 h-20 rounded-2xl bg-[#0B5FA5] flex items-center justify-center shadow-sm">
      <span class="text-white font-extrabold text-2xl tracking-tight">CW</span>
    </div>
    <div class="flex flex-col items-center gap-1.5">
      <h1 id="app-name" class="text-[#0B1F33] font-bold text-2xl tracking-tight">CarWash Pro</h1>
      <p id="app-tagline" class="text-[#6B7280] text-sm font-medium text-center">L'app des pros du lavage mobile</p>
    </div>
  </div>

  <div id="loading-indicator" class="w-full flex flex-col items-center pb-6">
    <div class="w-32 h-1 rounded-full bg-[#E2E6EA] overflow-hidden">
      <div class="h-full w-1/2 rounded-full bg-[#0B5FA5]"></div>
    </div>
  </div>

  <div class="safe-bottom w-full flex-shrink-0 flex items-end justify-center pb-2">
    <div class="w-32 h-1 rounded-full bg-[#0B1F33]/20"></div>
  </div>
</div>
</body>
</html>
