<!DOCTYPE html>
<html lang="fr">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prestation terminée</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-[#F5F7FA]">
<div id="cloture-screen" class="w-full h-[844px] max-w-[390px] mx-auto bg-[#F5F7FA] flex flex-col overflow-hidden relative">
  <div class="h-[44px] w-full flex-shrink-0"></div>

  <div id="cloture-content" class="flex-1 overflow-y-auto px-6 pt-8 flex flex-col items-center">
    <div class="w-[100px] h-[100px] rounded-full bg-[#E9F5EE] flex items-center justify-center mb-6">
      <i class="fa-solid fa-circle-check text-[#1B8A5A] text-4xl"></i>
    </div>
    <h1 class="text-[#0B1F33] font-bold text-2xl tracking-tight text-center mb-2">Prestation terminée</h1>
    <p class="text-[#6B7280] text-sm font-medium text-center mb-6">Merci Marc, votre mission a bien été enregistrée.</p>

    <div id="net-earned-card" class="w-full bg-white rounded-2xl shadow-sm p-6 flex flex-col items-center text-center mb-4">
      <span class="text-[#6B7280] text-sm font-semibold mb-1">Vous avez gagné</span>
      <span class="text-[#0B5FA5] font-extrabold text-4xl tracking-tight mb-1.5">77,60 € net</span>
      <span class="text-[#9CA3AF] text-xs font-medium">Versé sur votre compte sous 2 à 3 jours ouvrés.</span>
    </div>

    <div id="recap-card" class="w-full bg-white rounded-xl shadow-sm divide-y divide-[#F0F2F4] mb-4">
      <div class="flex items-center justify-between p-4">
        <span class="text-[#6B7280] text-sm font-medium">Formule</span>
        <span class="text-[#0B1F33] font-bold text-sm">Complet</span>
      </div>
      <div class="flex items-center justify-between p-4">
        <span class="text-[#6B7280] text-sm font-medium">Durée</span>
        <span class="text-[#0B1F33] font-bold text-sm">58 min</span>
      </div>
      <div class="flex items-center justify-between p-4">
        <span class="text-[#6B7280] text-sm font-medium">Client</span>
        <span class="text-[#0B1F33] font-bold text-sm">Client vérifié</span>
      </div>
      <div class="flex items-center justify-between p-4">
        <span class="text-[#6B7280] text-sm font-medium">Date</span>
        <span class="text-[#0B1F33] font-bold text-sm">Aujourd'hui, 15h02</span>
      </div>
    </div>

    <button class="flex items-center gap-2">
      <i class="fa-regular fa-file-lines text-[#6B7280] text-sm"></i>
      <span class="text-[#6B7280] font-semibold text-sm underline">Voir le reçu détaillé</span>
    </button>
  </div>

  <div id="cloture-cta" class="px-4 pt-3 pb-2 flex-shrink-0">
    <button class="w-full h-14 rounded-xl bg-[#0B5FA5] text-white font-bold text-base shadow-sm mb-2.5">Voir mes gains</button>
    <button class="w-full h-10 text-[#6B7280] font-semibold text-sm">Retour aux missions</button>
  </div>
  <div class="h-[24px] w-full flex-shrink-0 flex items-end justify-center pb-2">
    <div class="w-32 h-1 rounded-full bg-[#0B1F33]/15"></div>
  </div>
</div>
</body>
</html>
