<!DOCTYPE html>
<html lang="fr">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajouter une photo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-[#F5F7FA]">
<div id="popup-photosource-screen" class="w-full h-[844px] max-w-[390px] mx-auto relative overflow-hidden bg-[#F5F7FA]">

  <div id="backdrop" class="absolute inset-0 flex flex-col">
    <div class="h-[44px]"></div>
    <div class="px-5 pt-2 opacity-40">
      <div class="flex gap-2 mb-3">
        <div class="w-[76px] h-[76px] bg-[#C9CFD6] rounded-xl"></div>
        <div class="w-[76px] h-[76px] bg-[#C9CFD6] rounded-xl"></div>
        <div class="w-[76px] h-[76px] border-2 border-dashed border-[#C9CFD6] rounded-xl"></div>
        <div class="w-[76px] h-[76px] border-2 border-dashed border-[#C9CFD6] rounded-xl"></div>
      </div>
    </div>
    <div class="absolute inset-0 bg-[#0B1F33]/60"></div>
  </div>

  <div id="bottom-sheet" class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[20px] shadow-2xl flex flex-col">
    <div class="flex justify-center pt-3 pb-2">
      <div class="w-10 h-1.5 rounded-full bg-[#E2E6EA]"></div>
    </div>

    <div class="px-5 pb-3">
      <h2 class="text-[#0B1F33] font-bold text-base text-center mb-4">Ajouter une photo</h2>

      <div class="flex flex-col gap-3">
        <div class="flex items-center gap-3 rounded-xl border-2 border-[#E2E6EA] p-4">
          <div class="w-11 h-11 rounded-full bg-[#E7F0FA] flex items-center justify-center flex-shrink-0">
            <i class="fa-solid fa-camera text-[#0B5FA5] text-base"></i>
          </div>
          <div>
            <p class="text-[#0B1F33] font-bold text-sm">Prendre une photo</p>
            <p class="text-[#6B7280] text-xs font-medium mt-0.5">Utiliser l'appareil photo</p>
          </div>
        </div>
        <div class="flex items-center gap-3 rounded-xl border-2 border-[#E2E6EA] p-4">
          <div class="w-11 h-11 rounded-full bg-[#E7F0FA] flex items-center justify-center flex-shrink-0">
            <i class="fa-regular fa-image text-[#0B5FA5] text-base"></i>
          </div>
          <div>
            <p class="text-[#0B1F33] font-bold text-sm">Choisir depuis la galerie</p>
            <p class="text-[#6B7280] text-xs font-medium mt-0.5">Sélectionner une photo existante</p>
          </div>
        </div>
      </div>
    </div>

    <div class="px-5 pt-2 pb-3">
      <button class="w-full h-12 text-[#6B7280] font-semibold text-sm">Annuler</button>
    </div>
    <div class="h-[24px] w-full flex-shrink-0"></div>
  </div>
</div>
</body>
</html>
