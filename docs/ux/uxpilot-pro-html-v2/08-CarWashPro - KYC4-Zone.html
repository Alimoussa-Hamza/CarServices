<!DOCTYPE html>
<html lang="fr">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zone d'intervention</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-[#F5F7FA]">
<div id="kyc4-screen" class="w-full h-[844px] max-w-[390px] mx-auto bg-[#F5F7FA] flex flex-col overflow-hidden relative">
  <div class="h-[44px] w-full flex-shrink-0"></div>

  <div id="kyc4-header" class="px-5 pt-2 pb-3 flex-shrink-0">
    <div class="flex items-center justify-between mb-4">
      <button class="w-9 h-9 flex items-center justify-center -ml-2"><i class="fa-solid fa-chevron-left text-[#0B1F33] text-lg"></i></button>
      <span class="text-[#6B7280] text-xs font-semibold">4/7</span>
    </div>
    <div class="flex gap-1.5 mb-5">
      <div class="h-1.5 flex-1 rounded-full bg-[#0B5FA5]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#0B5FA5]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#0B5FA5]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#0B5FA5]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#E2E6EA]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#E2E6EA]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#E2E6EA]"></div>
    </div>
    <h1 class="text-[#0B1F33] font-bold text-2xl tracking-tight mb-2">Votre zone d'intervention</h1>
    <p class="text-[#6B7280] text-sm font-medium">Indiquez votre adresse de départ et le rayon que vous couvrez.</p>
  </div>

  <div id="kyc4-content" class="flex-1 overflow-y-auto px-5 pt-3 flex flex-col gap-5">
    <div id="places-search" class="h-14 rounded-xl border-2 border-[#0B5FA5] bg-white flex items-center px-4 gap-3">
      <i class="fa-solid fa-magnifying-glass text-[#6B7280] text-sm"></i>
      <input type="text" value="12 rue de la République, 69002 Lyon" class="flex-1 text-[#0B1F33] text-base font-medium outline-none bg-transparent" />
    </div>

    <div id="map-preview" class="relative w-full h-[230px] rounded-2xl overflow-hidden bg-[#EAF0EC]">
      <div class="absolute top-[20%] left-0 right-0 h-px bg-white/70"></div>
      <div class="absolute top-[55%] left-0 right-0 h-px bg-white/70"></div>
      <div class="absolute top-[80%] left-0 right-0 h-px bg-white/70"></div>
      <div class="absolute left-[25%] top-0 bottom-0 w-px bg-white/70"></div>
      <div class="absolute left-[65%] top-0 bottom-0 w-px bg-white/70"></div>
      <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[70%] aspect-square rounded-full border-2 border-dashed border-[#0B5FA5] bg-[#0B5FA5]/10"></div>
      <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-[85%] flex flex-col items-center">
        <i class="fa-solid fa-location-dot text-[#BE3B33] text-3xl drop-shadow"></i>
      </div>
      <div class="absolute left-1/2 top-1/2 -translate-x-1/2 translate-y-2 bg-white rounded-full px-2.5 py-1 shadow-sm">
        <span class="text-[#0B1F33] text-[11px] font-semibold">Départ</span>
      </div>
    </div>

    <div>
      <div class="flex items-center justify-between mb-2">
        <label class="text-[#0B1F33] text-sm font-semibold">Rayon d'intervention</label>
        <span class="text-[#0B5FA5] font-bold text-base">15 km</span>
      </div>
      <div class="relative w-full h-2 rounded-full bg-[#E2E6EA]">
        <div class="absolute left-0 top-0 bottom-0 w-[60%] rounded-full bg-[#0B5FA5]"></div>
        <div class="absolute left-[60%] top-1/2 -translate-y-1/2 -translate-x-1/2 w-6 h-6 rounded-full bg-white border-2 border-[#0B5FA5] shadow"></div>
      </div>
      <p class="text-[#6B7280] text-xs font-medium mt-3">Vous recevrez des missions dans ce périmètre autour de votre point de départ.</p>
    </div>
  </div>

  <div id="kyc4-cta" class="px-4 pt-3 pb-3 flex-shrink-0 bg-[#F5F7FA]">
    <button class="w-full h-14 rounded-xl bg-[#0B5FA5] text-white font-bold text-base shadow-sm">Continuer</button>
  </div>
  <div class="h-[24px] w-full flex-shrink-0 flex items-end justify-center pb-2">
    <div class="w-32 h-1 rounded-full bg-[#0B1F33]/15"></div>
  </div>
</div>
</body>
</html>
