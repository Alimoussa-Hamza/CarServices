<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vos disponibilités</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-[#F5F7FA]">
<div id="kyc6-screen" class="w-full h-[844px] max-w-[390px] mx-auto bg-[#F5F7FA] flex flex-col overflow-hidden relative">
  <div class="h-[44px] w-full flex-shrink-0"></div>

  <div id="kyc6-header" class="px-5 pt-2 pb-3 flex-shrink-0">
    <div class="flex items-center justify-between mb-4">
      <button class="w-9 h-9 flex items-center justify-center -ml-2"><i class="fa-solid fa-chevron-left text-[#0B1F33] text-lg"></i></button>
      <span class="text-[#6B7280] text-xs font-semibold">6/7</span>
    </div>
    <div class="flex gap-1.5 mb-5">
      <div class="h-1.5 flex-1 rounded-full bg-[#0B5FA5]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#0B5FA5]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#0B5FA5]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#0B5FA5]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#0B5FA5]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#0B5FA5]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#E2E6EA]"></div>
    </div>
    <h1 class="text-[#0B1F33] font-bold text-2xl tracking-tight mb-2">Vos disponibilités</h1>
    <p class="text-[#6B7280] text-sm font-medium">Sélectionnez les jours et créneaux où vous êtes disponible.</p>
  </div>

  <div id="kyc6-content" class="flex-1 overflow-y-auto px-5 pt-3 flex flex-col gap-6">
    <div id="day-chips" class="flex justify-between gap-1.5">
      <div class="w-11 h-11 rounded-full bg-[#0B5FA5] flex items-center justify-center flex-shrink-0"><span class="text-white font-bold text-xs">Lun</span></div>
      <div class="w-11 h-11 rounded-full bg-[#0B5FA5] flex items-center justify-center flex-shrink-0"><span class="text-white font-bold text-xs">Mar</span></div>
      <div class="w-11 h-11 rounded-full bg-white border-2 border-[#E2E6EA] flex items-center justify-center flex-shrink-0"><span class="text-[#6B7280] font-semibold text-xs">Mer</span></div>
      <div class="w-11 h-11 rounded-full bg-[#0B5FA5] flex items-center justify-center flex-shrink-0"><span class="text-white font-bold text-xs">Jeu</span></div>
      <div class="w-11 h-11 rounded-full bg-[#0B5FA5] flex items-center justify-center flex-shrink-0"><span class="text-white font-bold text-xs">Ven</span></div>
      <div class="w-11 h-11 rounded-full bg-[#0B5FA5] flex items-center justify-center flex-shrink-0"><span class="text-white font-bold text-xs">Sam</span></div>
      <div class="w-11 h-11 rounded-full bg-white border-2 border-[#E2E6EA] flex items-center justify-center flex-shrink-0"><span class="text-[#6B7280] font-semibold text-xs">Dim</span></div>
    </div>

    <div>
      <label class="block text-[#0B1F33] text-sm font-semibold mb-3">Créneaux horaires — Lundi</label>
      <div class="flex flex-wrap gap-2 mb-3">
        <div class="h-10 px-4 rounded-lg bg-[#0B5FA5] flex items-center justify-center"><span class="text-white font-semibold text-sm">8h-12h</span></div>
        <div class="h-10 px-4 rounded-lg bg-white border-2 border-[#E2E6EA] flex items-center justify-center"><span class="text-[#6B7280] font-semibold text-sm">12h-14h</span></div>
        <div class="h-10 px-4 rounded-lg bg-[#0B5FA5] flex items-center justify-center"><span class="text-white font-semibold text-sm">14h-18h</span></div>
        <div class="h-10 px-4 rounded-lg bg-white border-2 border-[#E2E6EA] flex items-center justify-center"><span class="text-[#6B7280] font-semibold text-sm">18h-20h</span></div>
      </div>
      <p class="text-[#6B7280] text-xs font-medium">Ces créneaux s'appliquent au jour sélectionné. Répétez pour chaque jour actif.</p>
    </div>

    <div id="repeat-row" class="bg-white rounded-xl shadow-sm p-4 flex items-center justify-between">
      <span class="text-[#0B1F33] font-semibold text-sm pr-4">Appliquer à tous les jours actifs</span>
      <div class="w-11 h-[26px] rounded-full bg-[#1B8A5A] flex items-center px-0.5 justify-end flex-shrink-0">
        <div class="w-[21px] h-[21px] rounded-full bg-white shadow"></div>
      </div>
    </div>
  </div>

  <div id="kyc6-cta" class="px-4 pt-3 pb-3 flex-shrink-0 bg-[#F5F7FA]">
    <button class="w-full h-14 rounded-xl bg-[#0B5FA5] text-white font-bold text-base shadow-sm">Continuer</button>
  </div>
  <div class="h-[24px] w-full flex-shrink-0 flex items-end justify-center pb-2">
    <div class="w-32 h-1 rounded-full bg-[#0B1F33]/15"></div>
  </div>
</div>
</body>
</html>
