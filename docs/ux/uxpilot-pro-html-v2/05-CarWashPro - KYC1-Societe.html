<!DOCTYPE html>
<html lang="fr">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votre société</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-[#F5F7FA]">
<div id="kyc1-screen" class="w-full h-[844px] max-w-[390px] mx-auto bg-[#F5F7FA] flex flex-col overflow-hidden relative">
  <div class="h-[44px] w-full flex-shrink-0"></div>

  <div id="kyc1-header" class="px-5 pt-2 pb-3 flex-shrink-0">
    <div class="flex items-center justify-between mb-4">
      <button class="w-9 h-9 flex items-center justify-center -ml-2"><i class="fa-solid fa-chevron-left text-[#0B1F33] text-lg"></i></button>
      <span class="text-[#6B7280] text-xs font-semibold">1/7</span>
    </div>
    <div class="flex gap-1.5 mb-5">
      <div class="h-1.5 flex-1 rounded-full bg-[#0B5FA5]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#E2E6EA]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#E2E6EA]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#E2E6EA]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#E2E6EA]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#E2E6EA]"></div>
      <div class="h-1.5 flex-1 rounded-full bg-[#E2E6EA]"></div>
    </div>
    <h1 class="text-[#0B1F33] font-bold text-2xl tracking-tight mb-2">Votre société</h1>
    <p class="text-[#6B7280] text-sm font-medium">Ces informations apparaîtront sur vos factures.</p>
  </div>

  <div id="kyc1-form" class="flex-1 overflow-y-auto px-5 pt-3 flex flex-col gap-5">
    <div>
      <label class="block text-[#0B1F33] text-sm font-semibold mb-2">Nom de l'entreprise</label>
      <div class="h-14 rounded-xl border-2 border-[#E2E6EA] bg-white flex items-center px-4">
        <input type="text" value="Marc Dubois Auto-Entrepreneur" class="w-full text-[#0B1F33] text-base font-medium outline-none bg-transparent" />
      </div>
    </div>
    <div>
      <label class="block text-[#0B1F33] text-sm font-semibold mb-2">Numéro SIRET</label>
      <div class="h-14 rounded-xl border-2 border-[#0B5FA5] bg-white flex items-center px-4">
        <input type="text" value="812 345 678 00021" class="w-full text-[#0B1F33] text-base font-medium outline-none bg-transparent" />
      </div>
      <p class="text-[#6B7280] text-xs font-medium mt-2">14 chiffres, visible sur votre extrait Kbis ou avis de situation INSEE.</p>
    </div>
    <div>
      <label class="block text-[#0B1F33] text-sm font-semibold mb-2">Adresse de facturation</label>
      <div class="h-14 rounded-xl border-2 border-[#E2E6EA] bg-white flex items-center px-4">
        <input type="text" value="12 rue de la République, 69002 Lyon" class="w-full text-[#0B1F33] text-base font-medium outline-none bg-transparent" />
      </div>
    </div>
    <div>
      <label class="block text-[#0B1F33] text-sm font-semibold mb-2">Statut juridique</label>
      <div class="h-14 rounded-xl border-2 border-[#E2E6EA] bg-white flex items-center justify-between px-4">
        <span class="text-[#0B1F33] text-base font-medium">Auto-entrepreneur</span>
        <i class="fa-solid fa-chevron-down text-[#6B7280] text-sm"></i>
      </div>
    </div>
  </div>

  <div id="kyc1-cta" class="px-4 pt-3 pb-3 flex-shrink-0 bg-[#F5F7FA]">
    <button class="w-full h-14 rounded-xl bg-[#0B5FA5] text-white font-bold text-base shadow-sm">Continuer</button>
  </div>
  <div class="h-[24px] w-full flex-shrink-0 flex items-end justify-center pb-2">
    <div class="w-32 h-1 rounded-full bg-[#0B1F33]/15"></div>
  </div>
</div>
</body>
</html>
